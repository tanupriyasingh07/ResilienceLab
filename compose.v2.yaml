services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: resiliencelab:v2-isolated
    container_name: resiliencelab-v2r-app
    ports:
      - "8001:8000"
    environment:
      NODE_CONTAINER_PREFIX: resiliencelab-v2r-node
    volumes:
      - resiliencelab-v2-data-isolated:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - v2-network
    depends_on:
      - node-1
      - node-2
      - node-3
    restart: unless-stopped

  node-1:
    build:
      context: .
      dockerfile: Dockerfile.node
    image: resiliencelab-node:v2-isolated
    container_name: resiliencelab-v2r-node-1
    environment:
      NODE_ID: node-1
    networks:
      - v2-network
    restart: unless-stopped

  node-2:
    image: resiliencelab-node:v2-isolated
    container_name: resiliencelab-v2r-node-2
    environment:
      NODE_ID: node-2
    networks:
      - v2-network
    restart: unless-stopped

  node-3:
    image: resiliencelab-node:v2-isolated
    container_name: resiliencelab-v2r-node-3
    environment:
      NODE_ID: node-3
    networks:
      - v2-network
    restart: unless-stopped

  prometheus-v2:
    image: prom/prometheus:latest
    container_name: resiliencelab-v2r-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus/v2/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=3d"
    mem_limit: 256m
    networks:
      - v2-network
    restart: unless-stopped


  grafana-v2:
    image: grafana/grafana:latest
    container_name: resiliencelab-v2r-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - resiliencelab-v2-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus-v2
    mem_limit: 256m
    networks:
      - v2-network
    restart: unless-stopped


volumes:
  resiliencelab-v2-data-isolated:
    external: true
  resiliencelab-v2-grafana-data:

networks:
  v2-network:
    external: true
    name: resiliencelab-v2-network
